<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reachy Mini</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36;
    --text: #e6e9ef; --dim: #8b94a7;
    --accent: #4da3ff; --ok: #3ddc97; --warn: #ffb454; --bad: #ff6b6b;
    --heard: #4da3ff; --said: #3ddc97;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9; --panel: #fff; --line: #e2e5ea;
      --text: #131722; --dim: #667085;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }

  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 11px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line);
    font-size: 13px; color: var(--dim);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 3px rgba(61,220,151,.18); }
  .dot.warn { background: var(--warn); box-shadow: 0 0 0 3px rgba(255,180,84,.18); }
  .dot.bad { background: var(--bad); box-shadow: 0 0 0 3px rgba(255,107,107,.18); }
  .dot.live { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px; margin-bottom: 16px;
  }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em;
       color: var(--dim); margin: 0 0 12px; font-weight: 600; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; }
  .panel-head h2 { margin-bottom: 12px; }
  button.toggle {
    font: inherit; font-size: 12.5px; cursor: pointer; color: var(--dim);
    background: var(--bg); border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 13px; margin-bottom: 12px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  button.toggle::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: var(--line);
  }
  button.toggle[aria-pressed="true"] {
    color: var(--accent); border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 10%, var(--panel));
  }
  button.toggle[aria-pressed="true"]::before { background: var(--accent); }

  /* Detail rows are hidden until Logs is on, so the default view stays a
     readable conversation rather than a debug trace. */
  .row.listen, .row.partial, .row.status { display: none; }
  body.logs .row.listen, body.logs .row.partial, body.logs .row.status { display: flex; }
  .row.listen .who, .row.partial .who { color: var(--dim); }
  .row.listen { color: var(--dim); font-size: 13px; }
  .row.partial { color: var(--dim); font-size: 13px; font-style: italic; }

  .modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
  button.mode {
    text-align: left; cursor: pointer; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 13px; transition: border-color .12s, background .12s;
  }
  button.mode:hover { border-color: var(--accent); }
  button.mode[aria-pressed="true"] {
    border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--panel));
  }
  button.mode .name { font-weight: 600; display: flex; align-items: center; gap: 7px; }
  button.mode .help { color: var(--dim); font-size: 12.5px; margin-top: 4px; }
  button.mode .flag { color: var(--warn); font-size: 11.5px; margin-top: 6px; }
  button.mode[aria-pressed="true"] .name::after {
    content: "active"; margin-left: auto; font-size: 11px; font-weight: 500;
    color: var(--accent); text-transform: uppercase; letter-spacing: .05em;
  }

  #log { max-height: 58vh; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .row { display: flex; gap: 10px; padding: 6px 4px; border-radius: 6px; align-items: baseline; }
  .row .t { color: var(--dim); font-size: 11.5px; font-variant-numeric: tabular-nums; flex: none; }
  .row .who { font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
               flex: none; width: 46px; font-weight: 600; }
  .row.heard .who { color: var(--heard); }
  .row.said  .who { color: var(--said); }
  .row.status .who, .row.error .who { color: var(--dim); }
  .row.error { color: var(--bad); }
  .row.status { color: var(--dim); font-size: 13.5px; }
  .row .msg { word-break: break-word; }
  .empty { color: var(--dim); padding: 22px 4px; text-align: center; }
  footer { color: var(--dim); font-size: 12.5px; text-align: center; margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Reachy Mini</h1>
    <span class="pill"><span class="dot" id="d-conn"></span><span id="s-conn">connecting</span></span>
    <span class="pill"><span class="dot" id="d-act"></span><span id="s-act">&mdash;</span></span>
    <span class="pill" id="p-up">up &mdash;</span>
  </header>

  <div class="panel">
    <h2>Mode</h2>
    <div class="modes" id="modes"></div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2>What it hears &amp; says</h2>
      <button id="btn-logs" class="toggle" type="button" aria-pressed="false">Logs</button>
    </div>
    <div id="log"><div class="empty">Waiting for the robot&hellip;</div></div>
  </div>

  <footer id="foot"></footer>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  let seq = 0, modesRendered = false, failures = 0, currentMode = null;

  const clock = ts => new Date(ts * 1000).toLocaleTimeString([], {hour12: false});

  function renderModes(modes, active) {
    if (!modesRendered) {
      $("modes").innerHTML = "";
      for (const m of modes) {
        const b = document.createElement("button");
        b.className = "mode";
        b.dataset.mode = m.id;
        b.type = "button";
        // Greeter depends on face detection, which is not yet working. Say so
        // here rather than letting it look broken when nothing happens.
        const flag = m.id === "greeter"
          ? '<div class="flag">Face detection not working yet &mdash; will not trigger</div>' : "";
        b.innerHTML = `<div class="name">${m.label}</div>
                       <div class="help">${m.help}</div>${flag}`;
        b.onclick = () => setMode(m.id);
        $("modes").appendChild(b);
      }
      modesRendered = true;
    }
    if (active !== currentMode) {
      currentMode = active;
      for (const b of document.querySelectorAll("button.mode"))
        b.setAttribute("aria-pressed", String(b.dataset.mode === active));
    }
  }

  async function setMode(mode) {
    // Reflect the click immediately; the next poll confirms it.
    renderModes([], mode);
    try {
      await fetch("/api/mode", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({mode})
      });
    } catch (e) { /* poll will resync */ }
  }

  function addRows(events) {
    const log = $("log");
    if (log.querySelector(".empty")) log.innerHTML = "";
    const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
    for (const e of events) {
      const row = document.createElement("div");
      row.className = "row " + e.kind;
      const who = {heard: "you", said: "robot", partial: "…", listen: "wake",
                   status: "•", error: "!"}[e.kind] || "";
      row.innerHTML = `<span class="t">${clock(e.at)}</span>
                       <span class="who">${who}</span>
                       <span class="msg"></span>`;
      row.querySelector(".msg").textContent = e.text;
      log.appendChild(row);
    }
    while (log.children.length > 300) log.removeChild(log.firstChild);
    if (atBottom) log.scrollTop = log.scrollHeight;
  }

  function setStatus(s) {
    renderModes(s.modes, s.mode);

    const conn = $("d-conn"), connText = $("s-conn");
    conn.className = "dot " + (s.ready ? "on" : "warn");
    connText.textContent = s.ready ? "running" : "starting…";

    const act = $("d-act");
    if (s.speaking)      { act.className = "dot on live";   $("s-act").textContent = "speaking"; }
    else if (s.listening){ act.className = "dot on live";   $("s-act").textContent = "listening"; }
    else                 { act.className = "dot";           $("s-act").textContent = "idle"; }

    const m = Math.floor(s.uptime_s / 60), sec = Math.floor(s.uptime_s % 60);
    $("p-up").textContent = `up ${m}m ${sec}s`;
    $("foot").textContent = s.last_heard_s_ago == null
      ? "Nothing heard yet."
      : `Last heard ${Math.round(s.last_heard_s_ago)}s ago.`;
  }

  function offline() {
    $("d-conn").className = "dot bad";
    $("s-conn").textContent = "robot offline";
    $("d-act").className = "dot";
    $("s-act").textContent = "—";
    $("foot").textContent = "Reconnecting… the robot may be restarting.";
  }

  // Remembered so the choice survives the page reloads that happen when the
  // robot restarts.
  const logsOn = localStorage.getItem("reachy-logs") === "1";
  document.body.classList.toggle("logs", logsOn);
  $("btn-logs").setAttribute("aria-pressed", String(logsOn));
  $("btn-logs").onclick = () => {
    const on = !document.body.classList.contains("logs");
    document.body.classList.toggle("logs", on);
    $("btn-logs").setAttribute("aria-pressed", String(on));
    localStorage.setItem("reachy-logs", on ? "1" : "0");
    const log = $("log");
    log.scrollTop = log.scrollHeight;
  };

  async function poll() {
    try {
      const r = await fetch(`/api/events?since=${seq}`);
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      if (d.events.length) addRows(d.events);
      seq = d.seq;
      setStatus(d.status);
      failures = 0;
    } catch (e) {
      // The app exits and relaunches on a dead robot link, so brief failures
      // are expected; only say "offline" once it is clearly not a blip.
      if (++failures >= 3) offline();
    } finally {
      setTimeout(poll, 700);
    }
  }
  poll();
})();
</script>
</body>
</html>
