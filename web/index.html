<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reachy Mini</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36;
    --text: #e6e9ef; --dim: #8b94a7;
    --accent: #4da3ff; --ok: #3ddc97; --warn: #ffb454; --bad: #ff6b6b;
    --heard: #4da3ff; --said: #3ddc97;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9; --panel: #fff; --line: #e2e5ea;
      --text: #131722; --dim: #667085;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }

  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 11px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line);
    font-size: 13px; color: var(--dim);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 3px rgba(61,220,151,.18); }
  .dot.warn { background: var(--warn); box-shadow: 0 0 0 3px rgba(255,180,84,.18); }
  .dot.bad { background: var(--bad); box-shadow: 0 0 0 3px rgba(255,107,107,.18); }
  .dot.live { animation: pulse 1.4s ease-in-out infinite; }
  #vol { width: 90px; accent-color: var(--accent); }
  #vol-val { min-width: 2.2em; text-align: right; font-variant-numeric: tabular-nums; }
  @keyframes pulse { 50% { opacity: .35; } }

  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px; margin-bottom: 16px;
  }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em;
       color: var(--dim); margin: 0 0 12px; font-weight: 600; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; }
  .panel-head h2 { margin-bottom: 12px; }
  button.toggle {
    font: inherit; font-size: 12.5px; cursor: pointer; color: var(--dim);
    background: var(--bg); border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 13px; margin-bottom: 12px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  button.toggle::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: var(--line);
  }
  button.toggle[aria-pressed="true"] {
    color: var(--accent); border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 10%, var(--panel));
  }
  button.toggle[aria-pressed="true"]::before { background: var(--accent); }

  /* Detail rows are hidden until Logs is on, so the default view stays a
     readable conversation rather than a debug trace. */
  .row.listen, .row.partial, .row.status { display: none; }
  body.logs .row.listen, body.logs .row.partial, body.logs .row.status { display: flex; }
  .row.listen .who, .row.partial .who { color: var(--dim); }
  .row.listen { color: var(--dim); font-size: 13px; }
  .row.partial { color: var(--dim); font-size: 13px; font-style: italic; }

  .modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
  button.mode {
    text-align: left; cursor: pointer; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 13px; transition: border-color .12s, background .12s;
  }
  button.mode:hover { border-color: var(--accent); }
  button.mode[aria-pressed="true"] {
    border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--panel));
  }
  button.mode .name { font-weight: 600; display: flex; align-items: center; gap: 7px; }
  button.mode .help { color: var(--dim); font-size: 12.5px; margin-top: 4px; }
  button.mode .flag { color: var(--warn); font-size: 11.5px; margin-top: 6px; }
  button.mode[aria-pressed="true"] .name::after {
    content: "active"; margin-left: auto; font-size: 11px; font-weight: 500;
    color: var(--accent); text-transform: uppercase; letter-spacing: .05em;
  }

  .ctl-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .ctl-row input {
    flex: 1; min-width: 200px; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 12px;
  }
  .ctl-row input:focus { outline: none; border-color: var(--accent); }
  button.act {
    font: inherit; cursor: pointer; color: var(--text); white-space: nowrap;
    background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 14px;
  }
  button.act:hover { border-color: var(--accent); }
  button.act:disabled { opacity: .5; cursor: default; }
  a.toggle { text-decoration: none; display: inline-flex; }

  .phrase-group { margin-bottom: 12px; }
  .phrase-group:last-child { margin-bottom: 0; }
  .phrase-group .lead { color: var(--dim); font-size: 12.5px; margin-bottom: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 13px; padding: 4px 11px; border-radius: 999px;
    background: var(--bg); border: 1px solid var(--line);
  }
  .chip.wake { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .dim { color: var(--dim); font-size: 13px; }

  #log { max-height: 58vh; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .row { display: flex; gap: 10px; padding: 6px 4px; border-radius: 6px; align-items: baseline; }
  .row .t { color: var(--dim); font-size: 11.5px; font-variant-numeric: tabular-nums; flex: none; }
  .row .who { font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
               flex: none; width: 46px; font-weight: 600; }
  .row.heard .who { color: var(--heard); }
  .row.said  .who { color: var(--said); }
  .row.status .who, .row.error .who { color: var(--dim); }
  .row.error { color: var(--bad); }
  .row.status { color: var(--dim); font-size: 13.5px; }
  .row .msg { word-break: break-word; }
  .empty { color: var(--dim); padding: 22px 4px; text-align: center; }
  footer { color: var(--dim); font-size: 12.5px; text-align: center; margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Reachy Mini</h1>
    <span class="pill"><span class="dot" id="d-conn"></span><span id="s-conn">connecting</span></span>
    <span class="pill"><span class="dot" id="d-act"></span><span id="s-act">&mdash;</span></span>
    <span class="pill" id="p-up">up &mdash;</span>
    <span class="pill" id="p-model" title="The language model answering questions">&#129504; &mdash;</span>
    <label class="pill" id="p-web" title="Let the robot look things up online. Off by default: it makes answers slower and costs credits.">
      <input type="checkbox" id="web-search"> &#127760; Web search
    </label>
    <label class="pill" id="p-openmic" title="Keep talking without saying 'Hey Reachy' before every question. Say it once to start; follow-ups need no wake word until half a minute of quiet.">
      <input type="checkbox" id="open-mic"> &#127908; Open mic
    </label>
    <span class="pill">
      <span title="Speaker volume">&#128266;</span>
      <input id="vol" type="range" min="0" max="100" step="5" aria-label="Speaker volume">
      <span id="vol-val">&mdash;</span>
      <select id="voice" aria-label="Speaking voice" title="Speaking voice"></select>
    </span>
  </header>

  <div class="panel">
    <h2>Mode</h2>
    <div class="modes" id="modes"></div>
  </div>

  <div class="panel">
    <h2>Direct control</h2>
    <div class="ctl-row">
      <input id="say-text" type="text" maxlength="300"
             placeholder="Type something for Reachy to say&hellip;">
      <button id="btn-say" class="act" type="button">Say it</button>
      <button id="btn-listen" class="act" type="button">&#127908; Listen now</button>
      <button id="btn-clear-cache" class="act" type="button"
              title="Forget every cached answer, so the next question reaches the model again">Clear answers</button>
    </div>
  </div>

  <div class="panel">
    <h2>Say any of these</h2>
    <div id="phrases"><span class="dim">loading&hellip;</span></div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2>What it hears &amp; says</h2>
      <span>
        <a id="btn-dl" class="toggle" href="/api/transcript" download="reachy-transcript.txt">Download</a>
        <button id="btn-logs" class="toggle" type="button" aria-pressed="false">Logs</button>
      </span>
    </div>
    <div id="log"><div class="empty">Waiting for the robot&hellip;</div></div>
  </div>

  <footer id="foot"></footer>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  let seq = 0, modesSignature = null, failures = 0, currentMode = null;

  const clock = ts => new Date(ts * 1000).toLocaleTimeString([], {hour12: false});

  function renderModes(modes, active) {
    // Re-render whenever the demo list OR any demo's availability changes,
    // rather than latching after the first paint. Two things depend on it: the
    // list is empty on the very first poll (the robot discovers demos while
    // the dashboard is already up), and a demo set aside for repeated failures
    // has to grey out with its reason while the session is running -- which is
    // the entire point of setting it aside. Comparing a signature keeps the
    // buttons stable between polls so clicks are not lost to a re-render.
    const signature = JSON.stringify(modes.map(m => [m.id, m.label, m.available, m.note]));
    if (modes.length && signature !== modesSignature) {
      $("modes").innerHTML = "";
      for (const m of modes) {
        const b = document.createElement("button");
        b.className = "mode";
        b.dataset.mode = m.id;
        b.type = "button";
        b.disabled = m.available === false;
        const flag = m.available === false && m.note
          ? `<div class="flag">Unavailable &mdash; ${m.note}</div>` : "";
        b.innerHTML = `<div class="name">${m.label}</div>
                       <div class="help">${m.help || ""}</div>${flag}`;
        b.onclick = () => setMode(m.id);
        $("modes").appendChild(b);
      }
      modesSignature = signature;
      currentMode = null;  // force the pressed state to be reapplied below
    }
    if (active !== currentMode) {
      currentMode = active;
      for (const b of document.querySelectorAll("button.mode"))
        b.setAttribute("aria-pressed", String(b.dataset.mode === active));
    }
  }

  async function setMode(mode) {
    // Reflect the click immediately; the next poll confirms it.
    renderModes([], mode);
    try {
      await fetch("/api/mode", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({mode})
      });
    } catch (e) { /* poll will resync */ }
  }

  function addRows(events) {
    const log = $("log");
    if (log.querySelector(".empty")) log.innerHTML = "";
    const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
    for (const e of events) {
      const row = document.createElement("div");
      row.className = "row " + e.kind;
      const who = {heard: "you", said: "robot", partial: "…", listen: "wake",
                   status: "•", error: "!"}[e.kind] || "";
      row.innerHTML = `<span class="t">${clock(e.at)}</span>
                       <span class="who">${who}</span>
                       <span class="msg"></span>`;
      row.querySelector(".msg").textContent = e.text;
      log.appendChild(row);
    }
    while (log.children.length > 300) log.removeChild(log.firstChild);
    if (atBottom) log.scrollTop = log.scrollHeight;
  }

  function setStatus(s) {
    renderModes(s.modes, s.mode);
    renderWebSearch(s);
    renderOpenMic(s);

    const conn = $("d-conn"), connText = $("s-conn");
    conn.className = "dot " + (s.ready ? "on" : "warn");
    connText.textContent = s.ready ? "running" : "starting…";

    // Asleep is a normal resting state, not a fault -- say so plainly, and say
    // how to get out of it, so it is never mistaken for the robot being stuck.
    const act = $("d-act");
    if (s.sleeping)      { act.className = "dot warn"; $("s-act").textContent = 'asleep — say "Hey Reachy"'; }
    else if (s.speaking) { act.className = "dot on live"; $("s-act").textContent = "speaking"; }
    else if (s.listening){ act.className = "dot on live"; $("s-act").textContent = "listening"; }
    else                 { act.className = "dot"; $("s-act").textContent = "idle"; }

    const m = Math.floor(s.uptime_s / 60), sec = Math.floor(s.uptime_s % 60);
    $("p-up").textContent = `up ${m}m ${sec}s`;
    $("foot").textContent = s.last_heard_s_ago == null
      ? "Nothing heard yet."
      : `Last heard ${Math.round(s.last_heard_s_ago)}s ago.`;
  }

  function offline() {
    $("d-conn").className = "dot bad";
    $("s-conn").textContent = "robot offline";
    $("d-act").className = "dot";
    $("s-act").textContent = "—";
    $("foot").textContent = "Reconnecting… the robot may be restarting.";
  }

  // Remembered so the choice survives the page reloads that happen when the
  // robot restarts.
  const logsOn = localStorage.getItem("reachy-logs") === "1";
  document.body.classList.toggle("logs", logsOn);
  $("btn-logs").setAttribute("aria-pressed", String(logsOn));
  $("btn-logs").onclick = () => {
    const on = !document.body.classList.contains("logs");
    document.body.classList.toggle("logs", on);
    $("btn-logs").setAttribute("aria-pressed", String(on));
    localStorage.setItem("reachy-logs", on ? "1" : "0");
    const log = $("log");
    log.scrollTop = log.scrollHeight;
  };

  // Direct control: say-box and listen-now. Both queue a request the voice
  // loop picks up between turns, so there can be a couple of seconds before
  // the robot acts -- the button disable is feedback that the press landed.
  const sayBox = $("say-text"), saidBtn = $("btn-say"), listenBtn = $("btn-listen");
  async function sendSay() {
    const text = sayBox.value.trim();
    if (!text) return;
    saidBtn.disabled = true;
    try {
      const r = await fetch("/api/say", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({text})
      });
      if (r.ok) sayBox.value = "";
    } catch (e) { /* leave the text so it can be retried */ }
    setTimeout(() => { saidBtn.disabled = false; }, 800);
  }
  saidBtn.onclick = sendSay;
  sayBox.addEventListener("keydown", e => { if (e.key === "Enter") sendSay(); });
  listenBtn.onclick = async () => {
    listenBtn.disabled = true;
    try { await fetch("/api/listen", {method: "POST"}); } catch (e) {}
    setTimeout(() => { listenBtn.disabled = false; }, 1500);
  };

  // A cached answer is served instantly and forever, so one that turns out to
  // be wrong outlives the mistake unless an operator can drop it. The result
  // arrives as a status line in the log rather than an alert.
  const cacheBtn = $("btn-clear-cache");
  if (cacheBtn) cacheBtn.onclick = async () => {
    cacheBtn.disabled = true;
    try { await fetch("/api/cache/clear", {method: "POST"}); } catch (e) {}
    setTimeout(() => { cacheBtn.disabled = false; }, 1500);
  };

  // Volume: read once at load, write on release (not every tick of the drag,
  // which would hammer the robot's API mid-gesture).
  (async () => {
    const slider = $("vol"), label = $("vol-val");
    try {
      const v = await (await fetch("/api/volume")).json();
      if (v.volume != null) { slider.value = v.volume; label.textContent = v.volume; }
    } catch (e) { label.textContent = "—"; }
    slider.oninput = () => { label.textContent = slider.value; };
    slider.onchange = async () => {
      try {
        const r = await fetch("/api/volume", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({volume: Number(slider.value)})
        });
        const v = await r.json();
        label.textContent = v.volume != null ? v.volume : "!";
      } catch (e) { label.textContent = "!"; }
    };
  })();

  // Web search. Driven from the polled status rather than kept locally, so two
  // people with the dashboard open on their phones see the same switch -- and
  // greyed out entirely when the live backend cannot search at all, rather than
  // offering a setting that would quietly do nothing.
  const webBox = $("web-search"), webPill = $("p-web");
  let webAvailable = null;
  function renderWebSearch(status) {
    if (!webBox) return;
    if (webAvailable !== status.web_search_available) {
      webAvailable = status.web_search_available;
      webBox.disabled = !webAvailable;
      webPill.style.opacity = webAvailable ? "" : "0.45";
      webPill.title = webAvailable
        ? "Let the robot look things up online. Off by default: it makes answers slower and costs credits."
        : "Unavailable — the model answering is running on this laptop and cannot search.";
    }
    if (document.activeElement !== webBox) webBox.checked = !!status.web_search;
  }
  if (webBox) webBox.onchange = async () => {
    const enabled = webBox.checked;
    try {
      await fetch("/api/websearch", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({enabled})
      });
    } catch (e) { webBox.checked = !enabled; }
  };

  // Open mic. Same shape as the switch above, and driven from the polled
  // status for the same reason: two people with this open should not see
  // different settings for one robot.
  const micBox = $("open-mic");
  function renderOpenMic(status) {
    if (!micBox) return;
    if (document.activeElement !== micBox) micBox.checked = !!status.open_mic;
  }
  if (micBox) micBox.onchange = async () => {
    const enabled = micBox.checked;
    try {
      await fetch("/api/openmic", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({enabled})
      });
    } catch (e) { micBox.checked = !enabled; }
  };

  // Which model is answering. Read once: it is fixed for the life of the
  // process, since brain/llm_backends.py resolves the backend at import.
  (async () => {
    const pill = $("p-model");
    if (!pill) return;
    // Model ids are for machines. "claude-sonnet-5" reads fine, but the local
    // one is "qwen2.5:1.5b-instruct-q4_K_M", which is unreadable over
    // somebody's shoulder at an open day.
    const pretty = id => id.split(":")[0].replace(/-instruct.*$/, "");
    try {
      const m = await (await fetch("/api/model")).json();
      const where = m.local === "yes" ? "on this laptop" : "in the cloud";
      pill.textContent = `\u{1F9E0} ${pretty(m.model)} ${where}`;
      pill.title = m.fallback
        ? `Answering with ${m.model} (${m.backend}). Falls back to ${m.fallback} on this laptop if the network fails.`
        : `Answering with ${m.model}, running on this laptop. No internet needed.`;
    } catch (e) { pill.style.display = "none"; }
  })();

  // Speaking voice. The change is queued for the voice loop rather than applied
  // here -- loading a piper voice swaps the object every utterance goes
  // through, and doing that from the browser's request thread while the robot
  // is mid-sentence is the same fault as speaking from it.
  (async () => {
    const sel = document.getElementById("voice");
    if (!sel) return;
    const pretty = n => n.replace(/^en_(US|GB)-/, "").replace(/-medium$/, "")
                         .replace(/^./, c => c.toUpperCase());
    try {
      const v = await (await fetch("/api/voices")).json();
      if (!v.available || !v.available.length) { sel.style.display = "none"; return; }
      sel.innerHTML = v.available
        .map(n => `<option value="${n}"${n === v.current ? " selected" : ""}>${pretty(n)}</option>`)
        .join("");
    } catch (e) { sel.style.display = "none"; return; }
    sel.onchange = async () => {
      try {
        await fetch("/api/voice", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({voice: sel.value})
        });
      } catch (e) { /* the next poll shows whether it took */ }
    };
  })();

  // Fetched once: these change only when the keyword file is regenerated.
  (async () => {
    try {
      const p = await (await fetch("/api/phrases")).json();
      const group = (lead, items, cls) => items.length
        ? `<div class="phrase-group"><div class="lead">${lead}</div><div class="chips">` +
          items.map(t => `<span class="chip ${cls}">${t}</span>`).join("") + `</div></div>`
        : "";
      // Capitalise the first letter only. .title()-style capitalisation would
      // render "tell me a story" as "Tell Me A Story", and this panel is read
      // aloud off the screen by visitors.
      const cap = t => t[0].toUpperCase() + t.slice(1);
      const demoGroups = (p.demos || [])
        .map(d => group(`To switch to ${d.label}`, d.phrases.map(cap), ""))
        .join("");
      const html =
        group("To wake it or start a question", p.wake, "wake") +
        demoGroups +
        group("To send it to sleep", p.sleep.map(cap), "");
      $("phrases").innerHTML = html ||
        '<span class="dim">Phrase list unavailable.</span>';
    } catch (e) {
      $("phrases").innerHTML = '<span class="dim">Phrase list unavailable.</span>';
    }
  })();

  async function poll() {
    try {
      const r = await fetch(`/api/events?since=${seq}`);
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      if (d.events.length) addRows(d.events);
      seq = d.seq;
      setStatus(d.status);
      failures = 0;
    } catch (e) {
      // The app exits and relaunches on a dead robot link, so brief failures
      // are expected; only say "offline" once it is clearly not a blip.
      if (++failures >= 3) offline();
    } finally {
      setTimeout(poll, 700);
    }
  }
  poll();
})();
</script>
</body>
</html>
